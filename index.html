<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真暗室 現像・停止・定着工程ガイド</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  select, input { -webkit-appearance: none; -moz-appearance: none; }
  .stage-inactive { opacity: 0.4; }
  .stage-active { opacity: 1; }
  .stage-done { opacity: 0.6; }
  .timer-ring { transition: stroke-dashoffset 1s linear; }
  .agitate-flash { animation: flashRed 0.5s ease-in-out 3; }
  @keyframes flashRed { 0%,100%{background:#1e293b;} 50%{background:#dc2626;} }
  .note-textarea { resize: vertical; min-height: 60px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<header class="bg-gray-950 py-4 px-4 shadow-lg border-b border-gray-800">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold text-amber-400">📷 写真暗室 現像・停止・定着工程ガイド</h1>
    <p class="text-gray-400 text-sm mt-1">フィルム種別・現像液・温度から最適な工程時間を表示</p>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-6 space-y-5">

  <!-- フィルム・現像液選択 -->
  <section class="bg-gray-800 rounded-xl p-5">
    <h2 class="font-bold text-amber-400 text-lg mb-4">設定</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- フィルム -->
      <div>
        <label for="film-select" class="block text-sm font-semibold text-gray-300 mb-1">フィルム種別</label>
        <select id="film-select" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="triX">Kodak Tri-X 400</option>
          <option value="hp5">Ilford HP5 Plus 400</option>
          <option value="tmax">Kodak T-Max 400</option>
          <option value="acros">Fujifilm Neopan Acros 100</option>
          <option value="custom">カスタム</option>
        </select>
      </div>

      <!-- 現像液 -->
      <div>
        <label for="dev-select" class="block text-sm font-semibold text-gray-300 mb-1">現像液</label>
        <select id="dev-select" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="d76">D-76（1:1）</option>
          <option value="hc110">HC-110（B液）</option>
          <option value="rodinal">Rodinal（1:50）</option>
          <option value="id11">ID-11（原液）</option>
          <option value="custom">カスタム</option>
        </select>
      </div>

      <!-- 温度 -->
      <div>
        <label for="temp-input" class="block text-sm font-semibold text-gray-300 mb-1">温度</label>
        <div class="flex items-center gap-2">
          <input type="range" id="temp-slider" min="18" max="24" step="0.5" value="20"
            class="flex-1 accent-amber-500" aria-label="現像温度スライダー">
          <input type="number" id="temp-input" min="18" max="24" step="0.5" value="20"
            class="w-16 bg-gray-700 border border-gray-600 rounded-lg px-2 py-2 text-sm text-white text-right focus:outline-none focus:ring-2 focus:ring-amber-500"
            aria-label="現像温度（℃）">
          <span class="text-gray-400 text-sm">℃</span>
        </div>
      </div>

      <!-- 参考感度 -->
      <div>
        <p class="block text-sm font-semibold text-gray-300 mb-1">フィルム感度</p>
        <p id="iso-display" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-amber-300">ISO 400</p>
      </div>
    </div>

    <!-- カスタム入力 -->
    <div id="custom-inputs" class="hidden mt-4 grid grid-cols-2 gap-3">
      <div>
        <label for="custom-dev-time" class="block text-xs text-gray-400 mb-1">現像時間（分）</label>
        <input type="number" id="custom-dev-time" min="1" max="60" value="10"
          class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
      <div>
        <label for="custom-fix-time" class="block text-xs text-gray-400 mb-1">定着時間（分）</label>
        <input type="number" id="custom-fix-time" min="1" max="30" value="5"
          class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
      </div>
    </div>

    <button id="lookup-btn" class="mt-4 w-full bg-amber-500 text-gray-900 py-3 rounded-xl font-bold hover:bg-amber-400 transition">
      工程時間を確認する
    </button>
  </section>

  <!-- 工程タイムテーブル -->
  <section id="time-table" class="bg-gray-800 rounded-xl p-5 hidden">
    <h2 class="font-bold text-amber-400 text-lg mb-4">工程タイムテーブル</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stage-cards"></div>
  </section>

  <!-- 3浴工程トラッカー -->
  <section id="stage-tracker" class="bg-gray-800 rounded-xl p-5 hidden">
    <h2 class="font-bold text-amber-400 text-lg mb-4">工程トラッカー</h2>

    <!-- ステージインジケーター -->
    <div class="flex items-center justify-center gap-2 mb-6" id="stage-indicators">
      <div class="stage-indicator text-center px-3 py-2 rounded-lg bg-gray-700" data-stage="0">
        <p class="text-xs text-gray-400">第1浴</p>
        <p class="text-sm font-bold text-white">現像</p>
      </div>
      <div class="text-gray-600">→</div>
      <div class="stage-indicator text-center px-3 py-2 rounded-lg bg-gray-700" data-stage="1">
        <p class="text-xs text-gray-400">第2浴</p>
        <p class="text-sm font-bold text-white">停止</p>
      </div>
      <div class="text-gray-600">→</div>
      <div class="stage-indicator text-center px-3 py-2 rounded-lg bg-gray-700" data-stage="2">
        <p class="text-xs text-gray-400">第3浴</p>
        <p class="text-sm font-bold text-white">定着</p>
      </div>
      <div class="text-gray-600">→</div>
      <div class="stage-indicator text-center px-3 py-2 rounded-lg bg-gray-700" data-stage="3">
        <p class="text-xs text-gray-400">最終</p>
        <p class="text-sm font-bold text-white">水洗</p>
      </div>
    </div>

    <!-- タイマー -->
    <div id="timer-display" class="text-center mb-5">
      <div class="relative inline-block">
        <svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#374151" stroke-width="8"/>
          <circle id="timer-ring" cx="70" cy="70" r="60" fill="none" stroke="#f59e0b" stroke-width="8"
            stroke-dasharray="376.99" stroke-dashoffset="0" transform="rotate(-90 70 70)" class="timer-ring"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="timer-time" class="text-3xl font-mono font-bold text-amber-400">--:--</span>
          <span id="timer-stage-label" class="text-xs text-gray-400 mt-1">待機中</span>
        </div>
      </div>
    </div>

    <!-- 撹拌アラート -->
    <div id="agitate-alert" class="hidden text-center bg-red-700 text-white py-3 px-4 rounded-xl font-bold text-lg mb-4 agitate-flash">
      🔄 今すぐ撹拌！（5回反転）
    </div>

    <!-- 撹拌インジケーター -->
    <div id="agitate-info" class="text-center text-sm text-gray-400 mb-4 hidden">
      <span id="agitate-desc"></span>
    </div>

    <!-- ボタン -->
    <div class="flex gap-3">
      <button id="start-btn" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-500 transition">
        ▶ 開始
      </button>
      <button id="next-stage-btn" class="flex-1 bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-500 transition hidden">
        次の工程へ →
      </button>
      <button id="reset-btn-timer" class="bg-gray-600 text-white px-4 py-3 rounded-xl font-bold hover:bg-gray-500 transition">
        リセット
      </button>
    </div>
  </section>

  <!-- 印画紙焼付けメモ -->
  <section class="bg-gray-800 rounded-xl p-5">
    <details>
      <summary class="flex items-center justify-between">
        <h2 class="font-bold text-amber-400 text-lg">🗒️ 印画紙焼付け露光メモ</h2>
        <span class="text-gray-400 text-sm" aria-hidden="true">▼</span>
      </summary>
      <div class="mt-4 space-y-4" id="print-memo-section">
        <div id="print-notes-list" class="space-y-3"></div>
        <div class="bg-gray-700 rounded-xl p-4">
          <h3 class="text-sm font-bold text-amber-300 mb-3">新規メモ追加</h3>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label for="paper-grade" class="block text-xs text-gray-400 mb-1">印画紙コントラスト（1-5）</label>
              <select id="paper-grade" class="w-full bg-gray-600 border border-gray-500 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                <option value="1">1（ソフト）</option>
                <option value="2">2（ノーマル-）</option>
                <option value="3" selected>3（ノーマル）</option>
                <option value="4">4（ハード）</option>
                <option value="5">5（ハード+）</option>
              </select>
            </div>
            <div>
              <label for="exposure-time" class="block text-xs text-gray-400 mb-1">露光時間（秒）</label>
              <input type="number" id="exposure-time" min="1" max="300" value="10"
                class="w-full bg-gray-600 border border-gray-500 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
          </div>
          <div class="mb-3">
            <label for="dodge-burn-notes" class="block text-xs text-gray-400 mb-1">覆い焼き・焼き込みメモ</label>
            <textarea id="dodge-burn-notes" class="note-textarea w-full bg-gray-600 border border-gray-500 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="例：空部分を+2秒焼き込み、顔を-1秒覆い焼き"></textarea>
          </div>
          <div class="mb-3">
            <label for="note-label" class="block text-xs text-gray-400 mb-1">ラベル（フィルム番号等）</label>
            <input type="text" id="note-label" maxlength="50"
              class="w-full bg-gray-600 border border-gray-500 rounded px-2 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="例：Roll-01 コマ5">
          </div>
          <button id="add-note-btn" class="w-full bg-amber-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-amber-500 transition">
            メモを保存
          </button>
        </div>
      </div>
    </details>
  </section>

</main>

<script>
// ===== 現像時間データベース（秒） =====
// [film][developer][temp_18, 19, 20, 21, 22, 23, 24]
const DEV_TIMES = {
  triX: {
    d76:   [780, 720, 660, 600, 540, 480, 420],
    hc110: [600, 540, 480, 420, 360, 330, 300],
    rodinal:[960, 900, 840, 780, 720, 660, 600],
    id11:  [720, 660, 600, 540, 480, 450, 420],
  },
  hp5: {
    d76:   [720, 660, 600, 540, 480, 420, 360],
    hc110: [540, 480, 420, 360, 330, 300, 270],
    rodinal:[900, 840, 780, 720, 660, 600, 540],
    id11:  [660, 600, 540, 480, 420, 390, 360],
  },
  tmax: {
    d76:   [480, 450, 420, 390, 360, 330, 300],
    hc110: [360, 330, 300, 270, 240, 210, 180],
    rodinal:[780, 720, 660, 600, 540, 480, 420],
    id11:  [420, 390, 360, 330, 300, 270, 240],
  },
  acros: {
    d76:   [600, 540, 480, 420, 360, 330, 300],
    hc110: [420, 390, 360, 330, 300, 270, 240],
    rodinal:[720, 660, 600, 540, 480, 420, 390],
    id11:  [540, 480, 420, 390, 360, 330, 300],
  },
};

const FILM_ISO = { triX: 'ISO 400', hp5: 'ISO 400', tmax: 'ISO 400', acros: 'ISO 100', custom: 'カスタム' };
const FIX_TIMES = { triX: 300, hp5: 300, tmax: 240, acros: 300, custom: null };
const WASH_TIME = 20 * 60; // 20分

// ===== 状態 =====
let stages = [];
let currentStage = 0;
let timerInterval = null;
let timerRemaining = 0;
let timerTotal = 0;
let agitateInterval = null;
let elapsedSeconds = 0;
let running = false;
let agitateAlertTimeout = null;

// ===== 設定セクション =====
document.getElementById('temp-slider').addEventListener('input', e => {
  document.getElementById('temp-input').value = e.target.value;
});
document.getElementById('temp-input').addEventListener('input', e => {
  const v = Math.min(24, Math.max(18, parseFloat(e.target.value) || 20));
  document.getElementById('temp-slider').value = v;
});

function updateFilmInfo() {
  const film = document.getElementById('film-select').value;
  const dev = document.getElementById('dev-select').value;
  document.getElementById('iso-display').textContent = FILM_ISO[film] || 'カスタム';
  const isCustom = film === 'custom' || dev === 'custom';
  document.getElementById('custom-inputs').classList.toggle('hidden', !isCustom);
}
document.getElementById('film-select').addEventListener('change', updateFilmInfo);
document.getElementById('dev-select').addEventListener('change', updateFilmInfo);

// ===== ルックアップ =====
document.getElementById('lookup-btn').addEventListener('click', () => {
  const film = document.getElementById('film-select').value;
  const dev = document.getElementById('dev-select').value;
  const temp = parseFloat(document.getElementById('temp-input').value);
  const tempIdx = Math.round((temp - 18) * 2);

  let devTime;
  if (film === 'custom' || dev === 'custom') {
    devTime = parseFloat(document.getElementById('custom-dev-time').value) * 60;
  } else {
    const tbl = DEV_TIMES[film]?.[dev];
    devTime = tbl ? tbl[Math.min(Math.max(tempIdx, 0), 6)] : 600;
  }

  let fixTime;
  if (film === 'custom') {
    fixTime = parseFloat(document.getElementById('custom-fix-time').value) * 60;
  } else {
    fixTime = FIX_TIMES[film] || 300;
  }

  stages = [
    { name: '現像', bath: '第1浴', seconds: devTime, color: '#f59e0b', agitate: true },
    { name: '停止', bath: '第2浴', seconds: 30, color: '#3b82f6', agitate: false },
    { name: '定着', bath: '第3浴', seconds: fixTime, color: '#10b981', agitate: true },
    { name: '水洗', bath: '最終',  seconds: WASH_TIME, color: '#8b5cf6', agitate: false },
  ];

  buildTimeTable();
  document.getElementById('time-table').classList.remove('hidden');
  document.getElementById('stage-tracker').classList.remove('hidden');
  resetTimer();
});

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function buildTimeTable() {
  const container = document.getElementById('stage-cards');
  container.innerHTML = '';
  stages.forEach((stage, i) => {
    const card = document.createElement('div');
    card.className = 'bg-gray-700 rounded-xl p-3 text-center';
    const bath = document.createElement('p');
    bath.className = 'text-xs text-gray-400';
    bath.textContent = stage.bath;
    const name = document.createElement('p');
    name.className = 'font-bold text-white mb-1';
    name.textContent = stage.name;
    const time = document.createElement('p');
    time.className = 'text-xl font-mono font-bold';
    time.style.color = stage.color;
    time.textContent = formatTime(stage.seconds);
    card.appendChild(bath);
    card.appendChild(name);
    card.appendChild(time);
    if (stage.agitate) {
      const agTag = document.createElement('p');
      agTag.className = 'text-xs mt-1';
      agTag.style.color = stage.color;
      agTag.textContent = '撹拌あり';
      card.appendChild(agTag);
    }
    container.appendChild(card);
  });
}

// ===== タイマー =====
function resetTimer() {
  clearInterval(timerInterval);
  clearTimeout(agitateAlertTimeout);
  timerInterval = null;
  running = false;
  currentStage = 0;
  elapsedSeconds = 0;
  updateStageIndicators();
  updateTimerDisplay();
  document.getElementById('agitate-alert').classList.add('hidden');
  document.getElementById('agitate-info').classList.add('hidden');
  document.getElementById('start-btn').textContent = '▶ 開始';
  document.getElementById('start-btn').classList.remove('hidden');
  document.getElementById('next-stage-btn').classList.add('hidden');
}

function startCurrentStage() {
  if (currentStage >= stages.length) return;
  const stage = stages[currentStage];
  timerRemaining = stage.seconds;
  timerTotal = stage.seconds;
  elapsedSeconds = 0;
  running = true;

  document.getElementById('start-btn').classList.add('hidden');
  document.getElementById('next-stage-btn').classList.add('hidden');
  document.getElementById('agitate-alert').classList.add('hidden');

  if (stage.agitate) {
    document.getElementById('agitate-info').classList.remove('hidden');
    document.getElementById('agitate-desc').textContent = '最初の30秒は連続撹拌。その後30秒ごとに5回反転。';
  } else {
    document.getElementById('agitate-info').classList.add('hidden');
  }

  updateTimerDisplay();
  updateStageIndicators();
  scheduleAgitation();

  timerInterval = setInterval(() => {
    timerRemaining--;
    elapsedSeconds++;
    updateTimerDisplay();

    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      running = false;
      clearTimeout(agitateAlertTimeout);
      document.getElementById('agitate-alert').classList.add('hidden');
      showStageComplete();
    }
  }, 1000);
}

function scheduleAgitation() {
  if (!stages[currentStage]?.agitate) return;
  clearTimeout(agitateAlertTimeout);

  // 最初の30秒は連続撹拌 → 30秒後から30秒ごと
  function scheduleNext(delay) {
    agitateAlertTimeout = setTimeout(() => {
      if (!running) return;
      showAgitateAlert();
      scheduleNext(30000);
    }, delay);
  }
  scheduleNext(30000);
}

function showAgitateAlert() {
  const alert = document.getElementById('agitate-alert');
  alert.classList.remove('hidden');
  alert.classList.remove('agitate-flash');
  void alert.offsetWidth; // reflow
  alert.classList.add('agitate-flash');
  setTimeout(() => alert.classList.add('hidden'), 4000);
}

function showStageComplete() {
  const name = stages[currentStage].name;
  document.getElementById('timer-stage-label').textContent = name + ' 完了！';
  if (currentStage < stages.length - 1) {
    document.getElementById('next-stage-btn').classList.remove('hidden');
  } else {
    document.getElementById('timer-stage-label').textContent = '全工程完了！';
    document.getElementById('start-btn').textContent = '完了 ✓';
    document.getElementById('start-btn').classList.remove('hidden');
    document.getElementById('start-btn').disabled = true;
    updateStageIndicators(true);
  }
}

function updateTimerDisplay() {
  if (stages.length === 0) return;
  const stage = stages[currentStage];
  document.getElementById('timer-time').textContent = running ? formatTime(timerRemaining) : (currentStage < stages.length ? formatTime(stages[currentStage].seconds) : '--:--');
  document.getElementById('timer-stage-label').textContent = running ? stage.name + '中' : (currentStage < stages.length ? stages[currentStage].name + ' 待機' : '');

  // リング更新
  const circumference = 376.99;
  const fraction = running ? timerRemaining / timerTotal : 1;
  const offset = circumference * (1 - fraction);
  document.getElementById('timer-ring').style.strokeDashoffset = offset;
  if (stage) document.getElementById('timer-ring').style.stroke = stage.color;
}

function updateStageIndicators(allDone) {
  const indicators = document.querySelectorAll('.stage-indicator');
  indicators.forEach((el, i) => {
    el.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-900', 'bg-green-900', 'bg-gray-700');
    if (allDone) {
      el.classList.add('bg-green-900');
    } else if (i < currentStage) {
      el.classList.add('bg-green-900');
    } else if (i === currentStage) {
      el.classList.add('bg-amber-900', 'ring-2', 'ring-amber-400');
    } else {
      el.classList.add('bg-gray-700');
    }
  });
}

document.getElementById('start-btn').addEventListener('click', () => {
  if (!running && stages.length > 0) startCurrentStage();
});

document.getElementById('next-stage-btn').addEventListener('click', () => {
  currentStage++;
  document.getElementById('next-stage-btn').classList.add('hidden');
  if (currentStage < stages.length) startCurrentStage();
});

document.getElementById('reset-btn-timer').addEventListener('click', resetTimer);

// ===== 印画紙メモ =====
const LS_NOTES = 'darkroom-print-notes';

function loadNotes() {
  try { return JSON.parse(localStorage.getItem(LS_NOTES) || '[]'); } catch { return []; }
}
function saveNotes(notes) {
  try { localStorage.setItem(LS_NOTES, JSON.stringify(notes)); } catch {}
}

function renderNotes() {
  const notes = loadNotes();
  const container = document.getElementById('print-notes-list');
  container.innerHTML = '';

  if (notes.length === 0) {
    const p = document.createElement('p');
    p.className = 'text-sm text-gray-500 text-center py-3';
    p.textContent = '保存されたメモはありません';
    container.appendChild(p);
    return;
  }

  notes.forEach((note, idx) => {
    const card = document.createElement('div');
    card.className = 'bg-gray-700 rounded-xl p-4';

    const header = document.createElement('div');
    header.className = 'flex justify-between items-start mb-2';

    const title = document.createElement('div');
    const labelEl = document.createElement('p');
    labelEl.className = 'font-bold text-amber-300 text-sm';
    labelEl.textContent = note.label || '無題';
    const metaEl = document.createElement('p');
    metaEl.className = 'text-xs text-gray-400';
    metaEl.textContent = 'コントラスト ' + note.grade + '  |  露光 ' + note.exposure + '秒';
    title.appendChild(labelEl);
    title.appendChild(metaEl);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'text-red-400 hover:text-red-300 text-xs px-2 py-1 rounded';
    delBtn.textContent = '削除';
    delBtn.setAttribute('aria-label', (note.label || '無題') + 'を削除');
    delBtn.addEventListener('click', () => {
      const n = loadNotes();
      n.splice(idx, 1);
      saveNotes(n);
      renderNotes();
    });

    header.appendChild(title);
    header.appendChild(delBtn);
    card.appendChild(header);

    if (note.dodgeBurn) {
      const p = document.createElement('p');
      p.className = 'text-xs text-gray-300';
      p.textContent = note.dodgeBurn;
      card.appendChild(p);
    }
    container.appendChild(card);
  });
}

document.getElementById('add-note-btn').addEventListener('click', () => {
  const grade = document.getElementById('paper-grade').value;
  const exposure = document.getElementById('exposure-time').value;
  const dodgeBurnEl = document.getElementById('dodge-burn-notes');
  const labelEl = document.getElementById('note-label');
  const dodgeBurn = dodgeBurnEl.value.trim();
  const label = labelEl.value.trim();

  const notes = loadNotes();
  notes.unshift({ grade, exposure, dodgeBurn, label, createdAt: new Date().toISOString() });
  saveNotes(notes);

  // フォームリセット
  document.getElementById('paper-grade').value = '3';
  document.getElementById('exposure-time').value = '10';
  dodgeBurnEl.value = '';
  labelEl.value = '';

  renderNotes();
});

// ===== 初期化 =====
updateFilmInfo();
renderNotes();
</script>
</body>
</html>
